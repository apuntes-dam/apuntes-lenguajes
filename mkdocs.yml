site_name: Apuntes de lenguajes
site_description: Elige un lenguaje (Dart, Java, Kotlin, Python) y pasa de uno a otro.
site_url: https://apuntes-dam.github.io/apuntes-lenguajes/
repo_url: https://github.com/apuntes-dam/apuntes-lenguajes
repo_name: GitHub
theme:
  name: material
  custom_dir: overrides
  language: es
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    - scheme: slate
      primary: custom
      toggle:
        icon: material/weather-night
        name: Cambiar a modo claro
    - scheme: default
      primary: custom
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo oscuro
  features:
    - navigation.top
    - content.code.copy
    - search.highlight
extra_css:
  - assets/extra.css
  - assets/lenguajes.css?v=ed6a84c1
extra_javascript:
  - assets/pasar.js
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/apuntes-dam/
      name: Síguenos en GitHub
copyright: Practica los Lenguajes de Programación para 1º DAM y 2º DAM · <a href="https://github.com/apuntes-dam/">Síguenos en GitHub</a>
markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true
nav:
  - Elegir lenguaje: index.md
  - "Fundamentos: algoritmos y pseudocódigo": fundamentos.md
  - Pasar de uno a otro: pasar.md
